  <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>السلوك الصحيح عند اللعب بالألعاب</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; margin: 0; }
  body {
    font-family: 'Tahoma', 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #fef6e4 0%, #e8f4fd 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px 12px 20px;
    min-height: 100vh;
  }
  .header { text-align: center; margin-bottom: 2px; flex-shrink: 0; }
  .title { font-size: 18px; font-weight: 800; color: #3a3a5c; margin: 2px 0; }
  .subtitle { font-size: 12px; color: #888; font-weight: 600; }

  .levels-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    width: 100%; max-width: 500px; gap: 16px; flex: 1; margin-top: 8px;
  }
  .levels-screen.hidden { display: none; }
  .level-card {
    display: flex; align-items: center; gap: 16px; width: 100%;
    background: #fff; border-radius: 18px; padding: 14px 18px;
    box-shadow: 0 5px 16px rgba(0,0,0,0.1); cursor: pointer;
    border: 3px solid transparent; transition: transform .15s ease;
  }
  .level-card:active { transform: scale(0.97); }
  .level-card .icon { font-size: 36px; }
  .level-card .info { flex: 1; text-align: right; }
  .level-card .info .lvl-title { font-size: 17px; font-weight: 800; color: #3a3a5c; }
  .level-card .info .lvl-sub { font-size: 13px; color: #888; margin-top: 3px; }
  .level-card .stars-mini { font-size: 15px; color: #ffca3a; min-width: 46px; text-align: left; }

  .sound-toggle {
    position: fixed; top: 12px; left: 12px;
    background: #fff; border: none; border-radius: 50%;
    width: 40px; height: 40px; font-size: 18px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15); cursor: pointer; z-index: 10;
  }
  .sound-toggle:active { transform: scale(0.92); }

  .prompt-row {
    display: none; align-items: center; gap: 8px; margin: 2px 0 4px;
    width: 100%; max-width: 500px; flex-shrink: 0;
  }
  .prompt-row.show { display: flex; }
  .prompt-box {
    background: #fff; border-radius: 14px; padding: 7px 16px; flex: 1;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08); font-size: 14px; font-weight: 700;
    color: #5b4b8a; text-align: center;
  }
  .speak-btn {
    background: #6c5ce7; border: none; border-radius: 50%;
    width: 34px; height: 34px; font-size: 14px; color: white; cursor: pointer;
    box-shadow: 0 3px 10px rgba(108,92,231,0.35); flex-shrink: 0;
  }
  .speak-btn:active { transform: scale(0.92); }
  .speak-btn.speaking { animation: pulse 0.6s infinite alternate; }
  @keyframes pulse { from { box-shadow: 0 0 0 0 rgba(108,92,231,0.5);} to { box-shadow: 0 0 0 8px rgba(108,92,231,0);} }

  .back-row { width: 100%; max-width: 500px; display: none; flex-shrink: 0; }
  .back-row.show { display: flex; }
  .back-btn { background: none; border: none; color: #6c5ce7; font-size: 13px; font-weight: 700; cursor: pointer; padding: 4px 2px; }

  .progress { display: flex; gap: 7px; margin: 2px 0 4px; display: none; flex-shrink: 0; }
  .progress.show { display: flex; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #e0dcf2; transition: all .25s ease; }
  .dot.done { background: #4caf50; transform: scale(1.15); }
  .dot.current { background: #6c5ce7; transform: scale(1.3); box-shadow: 0 0 0 3px #d9d3f8; }

  .game-area {
    display: none; flex-direction: column; align-items: center; width: 100%;
    flex: 1; min-height: 0; justify-content: flex-start;
  }

  .cards {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 500px;
  }
  .card {
    position: relative;
    width: 100%;
    border-radius: 18px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    cursor: pointer;
    border: 5px solid transparent;
    transition: transform .15s ease, border-color .2s ease;
    flex-shrink: 0;
  }
  .card:active { transform: scale(0.98); }
  .card img {
    width: 100%;
    aspect-ratio: 3 / 2;
    object-fit: cover;
    background: #f0eef8;
    display: block;
    image-rendering: -webkit-optimize-contrast;
  }
  .cards.lvl-2 .card img {
    aspect-ratio: 16 / 9;
  }
  .badge {
    position: absolute; top: 8px; left: 8px; font-size: 34px;
    opacity: 0; transform: scale(0.4); transition: all .3s ease;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.35));
  }
  .badge.show { opacity: 1; transform: scale(1); }
  .card.correct { border-color: #4caf50; }
  .card.wrong-flash { border-color: #ff7675; }
  .card.locked { cursor: default; }
  .card.shake { animation: shake .4s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  .feedback { min-height: 20px; margin-top: 6px; font-size: 14px; font-weight: 700; text-align: center; color: #3a3a5c; flex-shrink: 0; }

  .summary {
    display: none; flex-direction: column; align-items: center; text-align: center;
    background: #fff; border-radius: 22px; padding: 26px 22px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12); max-width: 420px; width: 100%;
  }
  .summary.show { display: flex; }
  .summary h2 { font-size: 22px; color: #3a3a5c; margin: 6px 0; }
  .summary .score { font-size: 34px; font-weight: 900; color: #6c5ce7; margin: 8px 0; }
  .summary .stars { font-size: 30px; margin: 6px 0 12px; letter-spacing: 4px; }
  .btn-row { display: flex; gap: 10px; margin-top: 6px; flex-wrap: wrap; justify-content: center; }
  .restart-btn, .levels-btn {
    padding: 11px 24px; font-size: 14px; font-weight: 700; border: none; border-radius: 28px;
    color: white; cursor: pointer; box-shadow: 0 5px 14px rgba(0,0,0,0.2);
  }
  .restart-btn { background: #4caf50; }
  .levels-btn { background: #6c5ce7; }
  .restart-btn:active, .levels-btn:active { transform: scale(0.96); }
  #summaryMsg { font-size: 14px; color: #666; margin-bottom: 8px; }
</style>
</head>
<body>

<button class="sound-toggle" id="soundToggle">🔊</button>

<div class="header">
  <div class="title">🌟 أين السلوك الصحيح؟ 🌟</div>
  <div class="subtitle">السلوك الصحيح عند اللعب بالألعاب</div>
</div>

<div class="levels-screen" id="levelsScreen">
  <div class="level-card lvl1" data-level="1">
    <div class="icon">🧸</div>
    <div class="info">
      <div class="lvl-title">المستوى الأول</div>
      <div class="lvl-sub">اختر بين صورتين</div>
    </div>
    <div class="stars-mini" id="starsL1"></div>
  </div>
  <div class="level-card lvl2" data-level="2">
    <div class="icon">🎯</div>
    <div class="info">
      <div class="lvl-title">المستوى الثاني</div>
      <div class="lvl-sub">اختر بين ثلاث صور</div>
    </div>
    <div class="stars-mini" id="starsL2"></div>
  </div>
</div>

<div class="back-row" id="backRow">
  <button class="back-btn" id="backBtn">➡️ العودة للمستويات</button>
</div>

<div class="prompt-row" id="promptRow">
  <button class="speak-btn" id="speakBtn">🔈</button>
  <div class="prompt-box" id="promptBox">ما هو السلوك الصحيح عند اللعب بالألعاب؟</div>
</div>

<div class="progress" id="progress"></div>

<div class="game-area" id="gameArea">
  <div class="cards" id="cards"></div>
  <div class="feedback" id="feedback"></div>
</div>

<div class="summary" id="summary">
  <h2>أحسنت! 🎉</h2>
  <div class="score" id="scoreText"></div>
  <div class="stars" id="starsText"></div>
  <div id="summaryMsg"></div>
  <div class="btn-row">
    <button class="restart-btn" id="restartBtn">🔁 إعادة المستوى</button>
    <button class="levels-btn" id="levelsBtn">📋 المستويات</button>
  </div>
</div>

const QUESTION_TEXT = "ما هو السلوك الصحيح عند اللعب بالألعاب؟";
const REPS_PER_LEVEL = 5;
const WRONG_MARK_DURATION = 2000; /* 2 seconds as requested */
const NEXT_REP_DELAY = 250;       /* tiny pause after the sound truly ends, before moving on */

/* ===== Level definitions ===== */
const LEVELS = {
  1: { images: [IMG_GOOD, IMG_BROKEN], correctIndex: 0 },
  2: { images: [IMG_GOOD, IMG_THROW, IMG_SAD], correctIndex: 0 }
};

let soundOn = true;
let currentLevel = null;
let currentRep = 0;
let score = 0;
let locked = false;
let stars = { 1: 0, 2: 0 };

/* Audio elements are attached to the DOM (hidden) instead of plain
   `new Audio()` objects — on iPad/Safari, detached audio objects can
   fire 'ended' unreliably, which is what was cutting the sound short. */
function makeAudioEl(src) {
  const el = document.createElement("audio");
  el.src = src;
  el.preload = "auto";
  el.style.display = "none";
  el.setAttribute("playsinline", "");
  el.setAttribute("webkit-playsinline", "");
  document.body.appendChild(el);
  return el;
}

const qAudio = makeAudioEl(AUDIO_QUESTION);
const correctAudio = makeAudioEl(AUDIO_CORRECT);
const wrongAudio = makeAudioEl(AUDIO_WRONG);
[qAudio, correctAudio, wrongAudio].forEach(a => { a.volume = 1.0; });

const ALL_AUDIOS = [qAudio, correctAudio, wrongAudio];

function playAudio(audio) {
  if (!soundOn) return;
  try {
    /* stop every other sound first so nothing ever overlaps */
    ALL_AUDIOS.forEach(a => {
      if (a !== audio) { a.pause(); a.currentTime = 0; }
    });
    audio.pause();
    audio.currentTime = 0;
    audio.volume = 1.0;
    audio.play().catch(()=>{});
  } catch(e) {}
}

document.getElementById("soundToggle").addEventListener("click", () => {
  soundOn = !soundOn;
  document.getElementById("soundToggle").textContent = soundOn ? "🔊" : "🔇";
  if (!soundOn) { qAudio.pause(); correctAudio.pause(); wrongAudio.pause(); }
});

document.getElementById("speakBtn").addEventListener("click", () => {
  const btn = document.getElementById("speakBtn");
  btn.classList.add("speaking");
  playAudio(qAudio);
  qAudio.onended = () => btn.classList.remove("speaking");
});

document.querySelectorAll(".level-card").forEach(card => {
  card.addEventListener("click", () => startLevel(parseInt(card.dataset.level, 10)));
});

document.getElementById("backBtn").addEventListener("click", showLevelsScreen);
document.getElementById("levelsBtn").addEventListener("click", showLevelsScreen);
document.getElementById("restartBtn").addEventListener("click", () => startLevel(currentLevel));

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function showLevelsScreen() {
  document.getElementById("levelsScreen").classList.remove("hidden");
  document.getElementById("backRow").classList.remove("show");
  document.getElementById("promptRow").classList.remove("show");
  document.getElementById("progress").classList.remove("show");
  document.getElementById("gameArea").style.display = "none";
  document.getElementById("summary").classList.remove("show");
  qAudio.pause(); correctAudio.pause(); wrongAudio.pause();
  renderStars();
}

function renderStars() {
  document.getElementById("starsL1").textContent = stars[1] > 0 ? "⭐".repeat(stars[1]) : "";
  document.getElementById("starsL2").textContent = stars[2] > 0 ? "⭐".repeat(stars[2]) : "";
}

function startLevel(levelNum) {
  currentLevel = levelNum;
  currentRep = 0;
  score = 0;
  locked = false;

  document.getElementById("levelsScreen").classList.add("hidden");
  document.getElementById("backRow").classList.add("show");
  document.getElementById("promptRow").classList.add("show");
  document.getElementById("progress").classList.add("show");
  document.getElementById("gameArea").style.display = "flex";
  document.getElementById("summary").classList.remove("show");

  buildProgressDots();
  nextRepetition();
}

function buildProgressDots() {
  const progress = document.getElementById("progress");
  progress.innerHTML = "";
  for (let i = 0; i < REPS_PER_LEVEL; i++) {
    const dot = document.createElement("div");
    dot.className = "dot";
    dot.id = "dot" + i;
    progress.appendChild(dot);
  }
  updateProgressDots();
}

function updateProgressDots() {
  for (let i = 0; i < REPS_PER_LEVEL; i++) {
    const dot = document.getElementById("dot" + i);
    dot.classList.remove("done", "current");
    if (i < currentRep) dot.classList.add("done");
    else if (i === currentRep) dot.classList.add("current");
  }
}

function nextRepetition() {
  if (currentRep >= REPS_PER_LEVEL) {
    finishLevel();
    return;
  }
  locked = false;
  updateProgressDots();
  document.getElementById("feedback").textContent = "";
  document.getElementById("promptBox").textContent = QUESTION_TEXT;
  renderCards();
  /* play the question loudly and clearly at the start of the repetition */
  setTimeout(() => playAudio(qAudio), 250);
}

function renderCards() {
  const level = LEVELS[currentLevel];
  const order = shuffle(level.images.map((img, idx) => ({ img, idx })));
  const cardsEl = document.getElementById("cards");
  cardsEl.classList.toggle("lvl-2", currentLevel === 2);
  cardsEl.innerHTML = "";
  order.forEach(item => {
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.correct = (item.idx === level.correctIndex) ? "1" : "0";
    card.innerHTML = `<img src="${item.img}" alt="خيار"><div class="badge"></div>`;
    card.addEventListener("click", () => onCardClick(card));
    cardsEl.appendChild(card);
  });
}

function onCardClick(card) {
  if (locked) return;
  const isCorrect = card.dataset.correct === "1";
  const badge = card.querySelector(".badge");

  if (isCorrect) {
    locked = true;
    document.querySelectorAll(".card").forEach(c => c.classList.add("locked"));
    card.classList.add("correct");
    badge.textContent = "✅";
    badge.classList.add("show");
    document.getElementById("feedback").textContent = "ممتاز! 🎉";
    score++;

    /* The correct-answer sound must be the LAST thing that happens —
       we never move to the next repetition until it has truly finished.
       Three independent checks back each other up (some mobile browsers
       don't fire 'ended' reliably for every audio element). */
    let advanced = false;
    let pollId = null;
    const goToNext = () => {
      if (advanced) return;
      advanced = true;
      if (pollId) clearInterval(pollId);
      setTimeout(advanceRepetition, NEXT_REP_DELAY);
    };

    correctAudio.addEventListener("ended", goToNext, { once: true });
    playAudio(correctAudio);

    /* poll actual playback position as a backup end-detector */
    pollId = setInterval(() => {
      if (correctAudio.ended ||
          (correctAudio.duration && correctAudio.currentTime >= correctAudio.duration - 0.1)) {
        goToNext();
      }
    }, 100);

    /* absolute last-resort fallback — must be LONGER than the actual
       clip, otherwise we'd cut the recording off early */
    const dur = (isFinite(correctAudio.duration) && correctAudio.duration > 0)
      ? correctAudio.duration : 8;
    setTimeout(goToNext, (dur * 1000) + 1500);
  } else {
    card.classList.add("wrong-flash", "shake");
    badge.textContent = "❌";
    badge.classList.add("show");
    playAudio(wrongAudio);
    setTimeout(() => {
      card.classList.remove("wrong-flash", "shake");
      badge.classList.remove("show");
    }, WRONG_MARK_DURATION);
  }
}

function advanceRepetition() {
  const anyCard = document.querySelector(".card");
  if (anyCard) anyCard.dataset.advanced = "1";
  currentRep++;
  nextRepetition();
}

function finishLevel() {
  document.getElementById("gameArea").style.display = "none";
  document.getElementById("promptRow").classList.remove("show");
  document.getElementById("progress").classList.remove("show");
  document.getElementById("backRow").classList.remove("show");

  const starCount = score >= REPS_PER_LEVEL ? 3 : (score >= 4 ? 2 : (score >= 3 ? 1 : 0));
  stars[currentLevel] = Math.max(stars[currentLevel], starCount);

  document.getElementById("scoreText").textContent = score + " / " + REPS_PER_LEVEL;
  document.getElementById("starsText").textContent = "⭐".repeat(starCount) + "☆".repeat(3 - starCount);
  document.getElementById("summaryMsg").textContent =
    starCount === 3 ? "رائع! أحسنت اختيار السلوك الصحيح دائمًا." :
    starCount >= 1 ? "عمل جيد! حاول مرة أخرى لتحصل على كل النجوم." :
    "لا بأس، هيا نحاول مرة أخرى معًا!";
  document.getElementById("summary").classList.add("show");
}

/* start on levels screen */
showLevelsScreen();
</script>
